<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeBug 除蟲專家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2a1f; --paper:#f2ead2; --hazard:#f5c518; --spray:#2f9e5b; --alert:#d6452c;
  --veil:rgba(29,42,31,0.86);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --veil:rgba(20,28,22,0.9); } }
:root[data-theme="dark"]{ --veil:rgba(20,28,22,0.9); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#2a2a24;color:var(--paper);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--veil);z-index:10;overflow:auto}
.ticket{max-width:430px;width:100%;background:var(--paper);color:var(--ink);padding:22px 22px 18px;border-radius:3px;transform:rotate(-1.2deg);box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,var(--ink) 12px 24px);border-radius:3px 3px 0 0}
.logo{font-family:"Bowlby One","Arial Black",sans-serif;font-size:clamp(2.6rem,11vw,3.6rem);line-height:.9;margin:10px 0 2px;color:var(--ink);letter-spacing:.01em}
.logo span{color:var(--spray)}
.role{font-weight:900;font-size:1rem;margin:0 0 14px}
.order{border:2px dashed var(--ink);padding:10px 12px;margin:0 0 14px;font-size:.95rem;line-height:1.7}
.order b{display:block;font-size:.8rem;letter-spacing:.06em;opacity:.7;margin-bottom:2px}
.controls{font-size:.82rem;line-height:1.85;margin:0 0 16px;opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:1rem;font-weight:900;padding:12px 18px;border-radius:3px;cursor:pointer;border:2px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--spray);color:#fff;border-color:var(--spray)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
.stamp{position:absolute;right:16px;top:28px;font-family:"Bowlby One",sans-serif;color:var(--alert);border:3px solid var(--alert);padding:2px 8px;transform:rotate(9deg);font-size:1rem;opacity:.85}
.result{font-size:1rem;line-height:1.9;margin:0 0 14px}
.grade{font-family:"Bowlby One",sans-serif;font-size:4rem;line-height:1;color:var(--spray)}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:5;display:none;background:rgba(242,234,210,.92);color:var(--ink);padding:10px 12px;border-radius:3px;font-weight:700;font-size:.95rem;line-height:1.7;min-width:170px}
.bar{height:9px;background:rgba(29,42,31,.18);border-radius:2px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--spray);width:100%}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:6;font-weight:900;font-size:1.6rem;text-align:center;color:var(--hazard);text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
#splat{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 52% 48%,rgba(60,35,12,.95) 0 9%,rgba(80,50,20,.65) 14%,rgba(0,0,0,0) 34%);display:flex;align-items:center;justify-content:center;font-size:24vmin}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:4;display:none;border:2px solid rgba(255,255,255,.7);border-radius:50%}
#touch{display:none}
#joy{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid rgba(242,234,210,.4);z-index:5}
#joyKnob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(242,234,210,.45)}
.tbtn{position:fixed;right:22px;z-index:5;width:72px;height:72px;border-radius:50%;font-size:1.7rem;border:2px solid var(--paper);color:var(--paper);background:rgba(29,42,31,.6)}
#sprayBtn{bottom:calc(26px + env(safe-area-inset-bottom,0px));background:rgba(47,158,91,.8)}
#trapBtn{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:#2a2a24;z-index:20}
#menuCv{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,calc(92vh * 1.4222));aspect-ratio:1024/720;height:auto;z-index:8;display:none;touch-action:none;cursor:pointer;filter:drop-shadow(0 14px 34px rgba(0,0,0,.5))}
</style>
</head>
<body>
<div id="start" class="screen">
  <div class="ticket">
    <div class="stamp">URGENT</div>
    <div class="logo">De<span>Bug</span></div>
    <div class="role">除蟲專家 · 第 001 號派工單</div>
    <div class="order"><b>社長留言</b>歡迎加入 DeBug 除蟲社！30 張派工單，場景隨機、害蟲越來越強，還會掉落臨時強化道具；打倒害蟲之王後還有無盡模式。進度會自動儲存。</div>
    <div class="controls" id="ctrlText">
      電腦：WASD 移動，滑鼠瞄準，按住左鍵噴殺蟲劑，右鍵或 E 放捕鼠夾<br>
      VR：左搖桿移動，右搖桿轉向，右手扳機噴殺蟲劑，左手扳機把捕鼠夾放在指著的地板上<br>選單：電腦用滑鼠點，VR 用手把指著按扳機
    </div>
    <div class="row">
      <button class="btn primary" id="play" disabled>整理裝備中…</button>
      <button class="btn" id="vr" disabled>檢查 VR 支援中…</button>
    </div>
  </div>
</div>
<div id="end" class="screen" style="display:none">
  <div class="ticket">
    <div class="logo" id="endTitle">JOB <span>DONE</span></div>
    <div class="role">結案報告</div>
    <div class="row" style="align-items:center;gap:18px;margin-bottom:10px"><div class="grade" id="grade">A</div><div class="result" id="endText"></div></div>
    <div class="row"><button class="btn primary" id="again">接下一張派工單</button></div>
  </div>
</div>
<div id="hud">
  <div id="hRoach">🪳 剩 0 隻</div>
  <div id="hRat">🐀 剩 0 隻</div>
  <div id="hTime">⏱ 4:00</div>
  <div id="hMoney">💰 0</div>
  <div id="hCombo" style="color:var(--spray)"></div>
  <div id="hBuff" style="color:#b8402a;font-size:.85rem"></div>
  <div id="hTrap">捕鼠夾 4 / 4</div>
  <div>殺蟲劑<div class="bar"><i id="sprayFill"></i></div></div>
</div>
<div id="msg"></div>
<div id="splat">🪳</div>
<div id="cross"></div>
<div id="touch"><div id="joy"><div id="joyKnob"></div></div><button class="tbtn" id="trapBtn" aria-label="放捕鼠夾">🪤</button><button class="tbtn" id="sprayBtn" aria-label="噴殺蟲劑">💨</button></div>
<canvas id="menuCv" aria-label="除蟲社選單"></canvas>
<div id="err">3D 函式庫載入失敗，請檢查網路後重新整理頁面。</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function(){
if(typeof THREE==='undefined'){document.getElementById('err').style.display='flex';return;}
const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const rnd=(a,b)=>a+Math.random()*(b-a);

/* ============ renderer ============ */
THREE.ColorManagement.legacyMode=false;

/* ============ textures ============ */
function canvasTex(w,h,draw,rep,raw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(!raw)t.encoding=THREE.sRGBEncoding;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}

function normalTex(w,h,drawH,str,rep){
  return canvasTex(w,h,(g)=>{drawH(g,w,h);const src=g.getImageData(0,0,w,h).data,out=g.createImageData(w,h);
    const H=(x,y)=>src[((((y%h)+h)%h)*w+(((x%w)+w)%w))*4]/255;

function grain(g,x0,y0,w,h,base,n,dark){g.fillStyle=base;g.fillRect(x0,y0,w,h);for(let i=0;i<n;i++){const yy=y0+R()*h;g.strokeStyle=`rgba(${dark},${rnr(.04,.22)})`;g.lineWidth=rnr(.5,1.8);g.beginPath();g.moveTo(x0,yy);g.bezierCurveTo(x0+w*.3,yy+rnr(-3,3),x0+w*.7,yy+rnr(-3,3),x0+w,yy+rnr(-2,2));g.stroke();}
  if(R()<.35){const kx=x0+R()*w,ky=y0+h/2;for(let k=0;k<6;k++){g.strokeStyle=`rgba(${dark},.25)`;g.beginPath();g.ellipse(kx,ky,4+k*3,1.5+k*1.2,0,0,7);g.stroke();}}}
const PLANKS=(()=>{const L=[];for(let r=0;r<16;r++){let x=-R()*200;while(x<512){const w=rnr(150,260);L.push([x,r*32,w,32]);x+=w;}}return L;})();
const TX={
  floor:canvasTex(512,512,(g)=>{for(const [x,y,w,h] of PLANKS){const l=rnr(31,38);grain(g,x,y,w,h,`hsl(${rnr(27,32)},${rnr(24,33)}%,${l}%)`,22,'45,22,8');

  tile:canvasTex(512,512,(g)=>{const n=8,s=64;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const a=(i+j)%2;g.fillStyle=a?`hsl(45,${rnr(14,20)}%,${rnr(78,83)}%)`:`hsl(150,${rnr(6,10)}%,${rnr(31,35)}%)`;g.fillRect(i*s,j*s,s,s);speck(g,0,0,0,[],0,0);}

    stain(g,512,512,30,'95,62,22',.12,.32,6,30);},[6.5/2,1.6/2]),
  tileN:normalTex(256,256,(g)=>{g.fillStyle='#909090';g.fillRect(0,0,256,256);g.fillStyle='#303030';for(let i=0;i<=8;i++){g.fillRect(i*32-1.5,0,3,256);g.fillRect(0,i*32-1.5,256,3);}},2.5,[6.5/2,1.6/2]),
  wall:canvasTex(512,512,(g)=>{g.fillStyle='#d8cdb0';g.fillRect(0,0,512,512);
    for(let x=0;x<512;x+=32){g.fillStyle='rgba(160,135,90,.10)';g.fillRect(x,0,12,512);g.fillStyle='rgba(255,250,235,.12)';g.fillRect(x+14,0,2,512);}
    for(let y=16;y<512;y+=64)for(let x=8;x<512;x+=64){const yy=y+((x/64)%2)*32;g.fillStyle='rgba(150,110,70,.16)';g.beginPath();for(let k=0;k<4;k++){g.ellipse(x+Math.cos(k*1.57)*4,yy+Math.sin(k*1.57)*4,3,2,k*1.57,0,7);}g.fill();g.fillStyle='rgba(120,130,90,.14)';g.fillRect(x-1,yy+5,2,8);}
    stain(g,512,512,16,'130,95,45',.05,.16,20,80);speck(g,512,512,5000,['rgba(80,60,30,.07)'],1,1.5);}),
  subway:canvasTex(256,256,(g)=>{g.fillStyle='#b7b2a6';g.fillRect(0,0,256,256);for(let r=0;r<8;r++){const off=(r%2)*32;for(let c=-1;c<5;c++){const x=c*64+off,y=r*32;const gr=g.createLinearGradient(0,y,0,y+32);gr.addColorStop(0,'#f6f3ec');gr.addColorStop(1,'#e2ddd2');g.fillStyle=gr;g.fillRect(x+2,y+2,60,28);}}stain(g,256,256,10,'150,110,50',.08,.2,6,24);}),
  subwayN:normalTex(256,256,(g)=>{g.fillStyle='#9a9a9a';g.fillRect(0,0,256,256);g.fillStyle='#202020';for(let r=0;r<8;r++){const off=(r%2)*32;g.fillRect(0,r*32,256,2);for(let c=-1;c<5;c++)g.fillRect(c*64+off,r*32,2,32);}},3),
  ceil:canvasTex(256,256,(g)=>{g.fillStyle='#e9e3d4';g.fillRect(0,0,256,256);speck(g,256,256,3000,['rgba(0,0,0,.05)','rgba(255,255,255,.08)'],1,2);stain(g,256,256,3,'140,110,60',.08,.18,20,60);},[3,2]),
  cab:canvasTex(256,256,(g)=>{grain(g,0,0,256,256,'#d6cbb0',60,'120,95,60');speck(g,256,256,1200,['rgba(0,0,0,.04)'],1,2);}),
  wood:canvasTex(256,256,(g)=>{for(let r=0;r<4;r++)grain(g,0,r*64,256,64,`hsl(${rnr(24,30)},${rnr(40,50)}%,${rnr(32,40)}%)`,40,'40,18,6');}),

  fabricN:normalTex(128,128,(g)=>{for(let y=0;y<128;y++)for(let x=0;x<128;x++){const v=128+60*Math.sin(x*1.57)*Math.sin(y*1.57);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,y,1,1);}},1.2),
  rug:canvasTex(512,352,(g,w,h)=>{g.fillStyle='#7a2a26';g.fillRect(0,0,w,h);g.strokeStyle='#d9b77a';g.lineWidth=10;g.strokeRect(22,22,w-44,h-44);g.fillStyle='#24324a';g.fillRect(34,34,w-68,h-68);g.fillStyle='#8a302a';g.fillRect(50,50,w-100,h-100);
    g.save();g.translate(w/2,h/2);for(let k=0;k<3;k++){g.fillStyle=['#d9b77a','#24324a','#c9583e'][k];g.beginPath();for(let a=0;a<=64;a++){const t=a/64*Math.PI*2,r=(120-k*34)*(1+.12*Math.cos(t*8));g.lineTo(Math.cos(t)*r*1.35,Math.sin(t)*r*.8);}g.fill();}g.restore();
    for(let i=0;i<40;i++){g.fillStyle=['#d9b77a','#e8d5a8','#24324a'][i%3];const x=70+R()*(w-140),y=70+R()*(h-140);if(Math.hypot((x-w/2)/1.35,(y-h/2)/.8)<150)continue;g.beginPath();g.arc(x,y,rnr(3,7),0,7);g.fill();}
    speck(g,w,h,8000,['rgba(0,0,0,.08)','rgba(255,255,255,.05)'],1,2);stain(g,w,h,5,'40,20,10',.15,.3,15,40);}),

function updateRoach(r,dt,time){
  if(r.kind==='mosquito'&&!r.boss){updateMosq(r,dt);return;}
  if(r.boss){updateBoss(r,dt);return;}
  if(r.slow>0)r.slow-=dt;
  if(r.st==='dead'){r.dead+=dt;return;}
  if(r.fly){updateFly(r,dt);return;}
  const d=r.pos.distanceTo(head);
  if(d<1.3&&r.st!=='flee'){if(r.kind==='spider'&&r.s.floor&&!r.fly&&Math.random()<0.35){launchFly(r);return;}r.st='flee';r.t=rnd(1.5,3);}
  r.t-=dt;
  if(r.st==='idle'){r.speed=0;if(r.t<=0){r.st='walk';r.t=rnd(0.4,1.6);r.a+=rnd(-1.5,1.5);}}
  else if(r.st==='walk'){r.speed=0.18;if(r.t<=0){r.st='idle';r.t=rnd(0.6,3);}}
  else if(r.st==='flee'){
    const [pu,pv]=surfProj(r.s,head);const away=Math.atan2(r.v-pv,r.u-pu);
    let da=away-r.a;da=Math.atan2(Math.sin(da),Math.cos(da));r.a+=da*Math.min(1,dt*6)+rnd(-0.4,0.4)*dt*10;
    r.speed=0.75+r.panic*0.6;if(r.t<=0&&d>1.6){r.st='idle';r.t=rnd(1,3);}

function updateTraps(dt){

    if(tr.snap>0){tr.snap=Math.min(1,tr.snap+dt*12);tr.g.userData.pivot.rotation.x=-2.8+2.8*tr.snap;}

function floorAim(origin,dir){
  if(dir.y>-0.08)return null;
  const t=-origin.y/dir.y;if(t>4.5)return null;
  const p=origin.clone().addScaledVector(dir,t);
  if(!surfOK(SURF[0],p.x,p.z,0.08))return null;
  for(const b of pBoxes)if(p.x>b[0]&&p.x<b[1]&&p.z>b[2]&&p.z<b[3])return null;
  return p;
}

/* ============ collision ============ */
function resolve(px,pz,r){
  px=clamp(px,-RX+r,RX-r);pz=clamp(pz,-RZ+r,RZ-r);
  for(let it=0;it<2;it++)for(const b of pBoxes){const qx=clamp(px,b[0],b[1]),qz=clamp(pz,b[2],b[3]),dx=px-qx,dz=pz-qz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-8){const d=Math.sqrt(d2),k=(r-d)/d;px+=dx*k;pz+=dz*k;}else{const l=px-b[0],rr=b[1]-px,t=pz-b[2],bb=b[3]-pz,m=Math.min(l,rr,t,bb);if(m===l)px=b[0]-r;else if(m===rr)px=b[1]+r;else if(m===t)pz=b[2]-r;else pz=b[3]+r;}}}
  return[px,pz];
}

  joy.addEventListener('touchstart',e=>{const t=e.changedTouches[0];joyId=t.identifier;const r=joy.getBoundingClientRect();jo={x:r.left+60,y:r.top+60};e.preventDefault();},{passive:false});
  window.addEventListener('touchmove',e=>{for(const t of e.changedTouches){
    if(t.identifier===joyId){let dx=t.clientX-jo.x,dy=t.clientY-jo.y;const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l;}knob.style.transform=`translate(${dx}px,${dy}px)`;input.jx=dx/50;input.jy=dy/50;}
    else if(t.identifier===lookId){yaw-=(t.clientX-lx)*0.005;pitch=clamp(pitch-(t.clientY-ly)*0.005,-1.4,1.2);lx=t.clientX;ly=t.clientY;camera.rotation.set(pitch,yaw,0);}}},{passive:false});
  renderer.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(t.clientX>window.innerWidth*0.4&&lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}},{passive:true});
  window.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===joyId){joyId=null;input.jx=input.jy=0;knob.style.transform='';}if(t.identifier===lookId)lookId=null;}});
  $('sprayBtn').addEventListener('touchstart',e=>{input.spray=true;e.preventDefault();},{passive:false});
  $('sprayBtn').addEventListener('touchend',()=>{input.spray=false;});
  $('trapBtn').addEventListener('click',()=>placeTrap(leftAim));
}

/* ============ WebXR ============ */
const vrBtn=$('vr');
if('xr' in navigator){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok){vrBtn.disabled=false;vrBtn.textContent='🥽 進入 VR';}else vrBtn.textContent='這個裝置不支援 VR';}).catch(()=>{vrBtn.textContent='這個頁面無法啟用 VR';});}
else vrBtn.textContent='這個瀏覽器不支援 WebXR';
vrBtn.addEventListener('click',async()=>{initAudio();try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(s);}catch(e){vrBtn.textContent='無法進入 VR，請再試一次';}});
[0,1].forEach(i=>{const c=renderer.xr.getController(i),g=renderer.xr.getControllerGrip(i);rig.add(c);rig.add(g);
  c.addEventListener('connected',e=>{c.userData.hand=e.data.handedness;
    if(e.data.handedness==='right'){g.add(can);can.position.set(0,0.0,0.02);can.rotation.set(-0.35,0,0);rightCtrl.obj=c;c.add(rightRay);}
    if(e.data.handedness==='left'){g.add(wrist.m);wrist.m.position.set(0,0.03,0.07);wrist.m.rotation.set(-1.1,0,0);wrist.m.visible=true;c.add(rayLine);leftCtrl.obj=c;}});
  c.addEventListener('selectstart',()=>{
    if(state==='hub'||state==='result'){panelClick(hover);return;}
    if(c.userData.hand==='right'){input.spray=true;}
    if(c.userData.hand==='left')placeTrap(leftAim);});
  c.addEventListener('selectend',()=>{if(c.userData.hand==='right')input.spray=false;});
});
renderer.xr.addEventListener('sessionstart',()=>{$('menuCv').style.display='none';camera.position.set(0,0,0);pMat.uniforms.uScale.value=900;
  $('start').style.display='none';$('end').style.display='none';$('hud').style.display='none';$('touch').style.display='none';$('cross').style.display='none';
  rig.position.set(START[0],0,START[1]);rig.rotation.set(0,0,0);if(state==='menu')openHub('jobs');else if(state==='hub'||state==='result'){needPlace=0.3;panel.m.visible=true;drawPanel();}});
renderer.xr.addEventListener('sessionend',()=>{$('menuCv').style.display='none';rig.rotation.set(0,0,0);camera.position.set(0,1.6,0);camera.rotation.set(pitch,yaw,0);attachCanDesktop();wrist.m.visible=false;rayLine.visible=false;vrMsg.m.visible=false;input.spray=false;panel.m.visible=false;rightRay.visible=false;newGame();
  state='menu';$('start').style.display='flex';$('hud').style.display='none';onResize();});

$('play').addEventListener('click',begin);
$('again').addEventListener('click',begin);
function onResize(){if(renderer.xr.isPresenting)return;camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);pMat.uniforms.uScale.value=window.innerHeight*0.5/Math.tan(camera.fov*Math.PI/360);if(menuDom())drawPanel();}
window.addEventListener('resize',onResize);onResize();

loadScene('apartment');newGame();
const clock=new THREE.Clock();
let frAcc=0,frN=0,curPR=renderer.getPixelRatio();const maxPR=curPR;
function dynRes(dt){frAcc+=dt;frN++;if(frAcc<2)return;const ms=frAcc/frN*1000;frAcc=0;frN=0;if(ms>24&&curPR>1){curPR=Math.max(1,curPR-0.25);renderer.setPixelRatio(curPR);}else if(ms<14&&curPR<maxPR){curPR=Math.min(maxPR,curPR+0.25);renderer.setPixelRatio(curPR);}}
let menuT=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05),time=clock.elapsedTime;
  if(state==='menu'&&!renderer.xr.isPresenting){menuT+=dt;camera.rotation.set(-0.35,Math.sin(menuT*0.15)*0.5,0);for(const r of roaches)updateRoach(r,dt,time);for(const m of rats)updateRat(m,dt,time);}
  update(dt,time);updateDust(time);moodTick(dt,time);if(!renderer.xr.isPresenting)dynRes(dt);
  renderer.render(scene,camera);
});
$('play').disabled=false;$('play').textContent='開始除蟲';
})();
</script>
</body>
</html>
